<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>hanami sleep mode</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    background: #050304;
    overflow: hidden;
    position: fixed;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
  }
  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at 55% 20%, #16090e 0%, #080406 55%, #020102 100%);
    overflow: hidden;
  }

  /* Ветка сакуры: сверху, сдвинута правее и повёрнута направо */
  .branch-wrap {
    position: absolute;
    top: -12px;
    left: 24vw;
    width: min(74vw, 780px);
    z-index: 5;
    pointer-events: none;
    transform-origin: 18% 8%;
    animation: branchSway 8s ease-in-out infinite alternate;
  }

  @keyframes branchSway {
    0%   { transform: rotate(4deg); }
    100% { transform: rotate(6.2deg); }
  }

  .caption {
    position: fixed;
    right: calc(18px + env(safe-area-inset-right));
    bottom: calc(22px + env(safe-area-inset-bottom));
    writing-mode: vertical-rl;
    text-orientation: mixed;
    color: rgba(255, 224, 235, 0.28);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 4.5px;
    text-transform: lowercase;
    pointer-events: none;
    z-index: 10;
  }

  .petal {
    position: absolute;
    right: -30px;
    opacity: var(--op);
    pointer-events: none;
    will-change: transform;
    animation: flyLeft var(--dur) linear var(--delay) infinite;
  }

  .particle {
    position: absolute;
    right: -15px;
    border-radius: 50%;
    background: rgba(255, 226, 236, 0.85);
    opacity: var(--op);
    pointer-events: none;
    will-change: transform;
    animation: flyParticleLeft var(--dur) linear var(--delay) infinite;
  }

  @keyframes flyLeft {
    0% {
      transform: translate3d(30px, 0px, 0) rotate(var(--r0)) scale(0.95);
    }
    50% {
      transform: translate3d(-52vw, var(--sway), 0) rotate(calc((var(--r0) + var(--r1)) / 2)) scale(1.04);
    }
    100% {
      transform: translate3d(calc(-100vw - 60px), calc(var(--sway) * 1.35), 0) rotate(var(--r1)) scale(0.95);
    }
  }

  @keyframes flyParticleLeft {
    0% {
      transform: translate3d(20px, 0px, 0);
    }
    50% {
      transform: translate3d(-52vw, var(--sway), 0);
    }
    100% {
      transform: translate3d(calc(-100vw - 40px), calc(var(--sway) * 1.15), 0);
    }
  }
</style>
